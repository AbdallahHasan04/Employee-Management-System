<div>
  <h2> Employees </h2>

  <div>
    @if ( !editingEmployee ) {
      <mat-form-field appearance="outline">
        <mat-label> Name </mat-label>
        <input matInput [(ngModel)]="newName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label> Email </mat-label>
        <input matInput [(ngModel)]="newEmail" type="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label> Position </mat-label>
        <input matInput [(ngModel)]="newPosition">
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="onAdd()">Add</button>

    } @else {
      <mat-form-field appearance="outline">
        <mat-label> Name </mat-label>
        <input matInput [(ngModel)]="editingEmployee.name">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label> Email </mat-label>
        <input matInput [(ngModel)]="editingEmployee.email" type="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label> Position </mat-label>
        <input matInput [(ngModel)]="editingEmployee.position">
      </mat-form-field>

      <button mat-raised-button color="accent" (click)="onUpdate()">Update</button>
      <button mat-button (click)="editingEmployee = null">Cancel</button>
    }
  </div>

  <table mat-table [dataSource]="employees" class="mat-elevation-z2" style="width: 100%; margin-top: 20px;">
    
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let item"> {{item.id}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let item"> {{item.name}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let item"> {{item.email}} </td>
    </ng-container>

    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> Position </th>
      <td mat-cell *matCellDef="let item"> {{item.position}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let item">
        <button mat-button color="primary" (click)="onEdit(item)">Edit</button>
        <button mat-button color="warn" (click)="onDelete(item.id)">Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
